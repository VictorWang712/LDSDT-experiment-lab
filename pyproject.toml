[project]
name = "ldsdt-lab"
version = "0.1.0"
description = "LDSDT 课程实验仓库：基于 iCode 的端到端多智能体软件开发系统"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
ldsdt = "ldsdt_kit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ldsdt_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
